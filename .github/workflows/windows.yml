name: Windows build and test
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: pwsh
        run: rustup update stable --no-self-update
      - name: Accounting and signal regression tests
        run: cargo +stable test --locked --lib --test managed_execution --test test_signals
      - name: Build executable
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Check executable without credentials
        shell: pwsh
        run: |
          ./bitcoin-prediction-bot.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke check failed' }
      - name: Package Windows download
        shell: pwsh
        run: |
          New-Item -ItemType Directory package
          Copy-Item bitcoin-prediction-bot.exe,Start-Windows.cmd,Build-Windows.ps1,config.yaml,.env.example,WINDOWS.md,README.md,RESULTS.md package
          Copy-Item results package -Recurse
          Compress-Archive -Path package/* -DestinationPath kalshi-prediction-windows-x64.zip
          (Get-FileHash kalshi-prediction-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  kalshi-prediction-windows-x64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-prediction-windows-x64
          path: |
            kalshi-prediction-windows-x64.zip
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kalshi-prediction-windows-x64
      - name: Publish tested Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" kalshi-prediction-windows-x64.zip SHA256SUMS.txt --title "Windows x64 $RELEASE_TAG" --notes "Windows demo edition. See WINDOWS.md for setup. Historical demo results are not Windows performance. Unsigned executable; credentials not included."

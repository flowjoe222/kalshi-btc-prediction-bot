name: Kalshi BTC 15-minute prediction

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip during Kalshi Thursday maintenance
        id: maint
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          # Thursday 03:00-05:00 ET == 2:00-4:00 AM America/Chicago.
          skip = now.weekday() == 3 and 3 <= now.hour < 5
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as fh:
                  fh.write(f"skip={'true' if skip else 'false'}\n")
          if skip:
              msg = f"Skipped: Kalshi Thursday maintenance window (2:00–4:00 AM CST / 3:00–5:00 AM ET, {now.isoformat()})"
              print(msg)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(f"## Kalshi BTC 15-Minute Prediction\n\n{msg}\n")
          else:
              print(f"Outside maintenance window ({now.isoformat()})")
          PY

      - name: Run KXBTC15M fair-value prediction
        if: steps.maint.outputs.skip != 'true'
        run: |
          python3 scripts/predict_btc_15m.py --ledger docs/data/ledger.json | tee prediction.txt
          {
            echo "## Kalshi BTC 15-Minute Prediction"
            echo ""
            echo '```text'
            cat prediction.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated prediction ledger
        if: steps.maint.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ledger.json
          if git diff --cached --quiet; then
            echo "Ledger unchanged"
          else
            git commit -m "Update KXBTC15M prediction ledger [skip ci]"
            git pull --rebase origin main
            git push
          fi
